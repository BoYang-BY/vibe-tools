8.2 Enchanted　|　純前端單檔網頁 · 自動保存於此瀏覽器</div></div><div id="modalRoot"></div><div id="toastRoot"></div><script>
(()=>{'use strict';
const KEY='lifeGarden.v7',OLD='lifeGarden.v6',COLLECTION='lifeGarden.v7.collection';
const $=id=>document.getElementById(id);

// V8.1: fully offline procedural forest ambient music; no audio files or external services.
// Browsers only allow playback after the player explicitly presses the music button.
const MUSIC_KEY='lifeGarden.music.preferences.v82';
let musicPrefs={volume:68};
try{musicPrefs={...musicPrefs,...JSON.parse(localStorage.getItem(MUSIC_KEY)||'{}')}}catch{}
let audioCtx=null,musicMaster=null,musicTimer=null,musicActive=false,musicStep=0,musicWanted=true;
// 32-beat melody with varied phrasing, low drone and soft arpeggios.
const melody=[659.25,783.99,880,0,783.99,659.25,587.33,523.25,587.33,659.25,783.99,0,880,783.99,659.25,0,587.33,659.25,783.99,0,698.46,659.25,523.25,493.88,523.25,587.33,659.25,783.99,659.25,587.33,523.25,0];
const roots=[261.63,220,174.61,196,261.63,220,174.61,196];
function note(freq,when,duration,level=0.1,shape='sine'){
 if(!audioCtx||!musicMaster||!freq)return;
 const osc=audioCtx.createOscillator(),env=audioCtx.createGain();
 osc.type=shape;osc.frequency.setValueAtTime(freq,when);
 env.gain.setValueAtTime(0.0001,when);
 env.gain.exponentialRampToValueAtTime(Math.max(level,0.0002),when+Math.min(0.22,duration*.32));
 env.gain.exponentialRampToValueAtTime(0.0001,when+duration);
 osc.connect(env);env.connect(musicMaster);osc.start(when);osc.stop(when+duration+.05);
}
function playBeat(){
 if(!audioCtx||!musicActive)return;
 const i=musicStep%melody.length,t=audioCtx.currentTime+.035;
 const root=roots[Math.floor(i/4)%roots.length];
 if(melody[i]){note(melody[i],t,1.18,.125,'sine');note(melody[i]*.5,t+.025,.7,.018,'triangle')}
 if(i%4===0){
   note(root/2,t,3.4,.066,'triangle');
   note(root,t+.09,3.1,.050,'sine');
   note(root*1.5,t+.19,2.8,.039,'sine');
   note(root*2,t+.31,2.4,.025,'sine');
 }
 if(i%2===1)note(root*2,t+.15,.9,.022,'sine');
 if(i%8===6)note(root*3,t+.29,1.4,.026,'sine');
 musicStep++;
}
function updateMusicUi(){
 const btn=$('musicToggle');if(!btn)return;
 btn.textContent=musicActive?'♫ 音樂播放中':'♫ 音樂預設開啟';

 $('musicVolume').value=musicPrefs.volume;
}
function setMusicVolume(value){
 musicPrefs.volume=Math.min(100,Math.max(0,Number(value)||0));
 try{localStorage.setItem(MUSIC_KEY,JSON.stringify(musicPrefs))}catch{}
 if(musicMaster&&audioCtx)musicMaster.gain.setTargetAtTime(musicPrefs.volume/100*.82,audioCtx.currentTime,.08);
}
let autoStarting=false;
async function toggleMusic(){
 if(musicActive){musicWanted=false;musicActive=false;clearInterval(musicTimer);musicTimer=null;
  if(musicMaster&&audioCtx)musicMaster.gain.setTargetAtTime(0,audioCtx.currentTime,.06);
  updateMusicUi();return;
 }
 try{
  const AudioContextCtor=window.AudioContext||window.webkitAudioContext;
  if(!AudioContextCtor){toast('這個瀏覽器不支援背景音樂');return}
  if(!audioCtx){audioCtx=new AudioContextCtor();musicMaster=audioCtx.createGain();musicMaster.gain.value=0;musicMaster.connect(audioCtx.destination)}

  musicMaster.gain.setTargetAtTime(musicPrefs.volume/100*.82,audioCtx.currentTime,.1);
  musicWanted=true;musicActive=true;playBeat();musicTimer=setInterval(playBeat,660);updateMusicUi();
  if(!autoStarting)toast('森林旋律已開啟 · 可隨時調整音量');
 }catch(err){console.warn('音樂尚待互動啟用',err);if(!autoStarting)toast('請點擊音樂按鈕以啟用聲音')}

updateMusicUi();
// Autoplay policy: attempt immediately, then activate on first real user gesture.

}

window.addEventListener('load',()=>{
 if(!musicWanted||musicActive)return;
 autoStarting=true;

});

 if(!audioCtx||!musicActive)return;

});

function sceneForStep(){let ev=scenes[state.step];if(state.step===5){if(!state.weather){state.weather=['rain','wind','fog'][Math.floor(Math.random()*3)];save()}let data={rain:{title:'驟雨中的紙船',body:'暴雨沖走了一艘裝著願望的紙船。你看見它在溪流裡打轉。',options:choices(['涉水追回紙船','adventure','你踏進溪流，勇敢把紙船送回岸邊。'],['等雨勢稍緩，再尋找安全路線','calm','你耐心觀察水流，終於找到安全的落腳處。'],['替紙船的主人寫下一個新願望','imagination','你寫下新的願望，紙船在雨裡亮起柔和光芒。'])},wind:{title:'風中的迷路小鳥',body:'狂風吹亂樹梢，一隻小鳥找不到回巢的方向。',options:choices(['帶牠一起尋找回家的路','adventure','你循著風的方向探索，終於找到小鳥的家。'],['用雙手替牠擋風','warmth','你守在原地，直到風平息，小鳥才安心飛起。'],['聆聽風聲，辨認巢穴所在','calm','你聽見遠方微弱的鳥鳴，為牠指出回家的方向。'])},fog:{title:'濃霧裡的回聲',body:'霧氣漫過腳踝，遠處傳來熟悉又陌生的歌聲。',options:choices(['循著歌聲走入霧中','adventure','你在霧裡發現一條閃光的小徑。'],['坐下來，等待聲音變得清晰','calm','你發現歌聲其實來自風吹過的樹洞。'],['跟著旋律哼唱，創造新的歌','imagination','霧氣化成一串音符，繞著植物飛舞。'])}};return {...ev,...data[state.weather],chapter:ev.chapter}}if(state.step===6){let f=state.flags;return {...ev,name:f.helped?'螢火蟲的回禮':f.observed?'苔蘚旁的重逢':'守護者的消息',body:f.helped?'曾受你照顧的螢火蟲帶著同伴飛來，替你照亮一條小路。':f.observed?'你回到那片苔蘚旁，螢火蟲已恢復精神，安靜地停在葉尖。':'先前遇見的森林旅人帶來好消息：那隻螢火蟲已經平安回家。',options:choices(['跟著光點，探索一條新路','adventure','你跟隨光點穿過枝葉，遇見一處從未見過的風景。'],['向螢火蟲與旅人表達感謝','warmth','一串溫柔的光點停在你的植物旁，久久不散。'],['把這次相遇記成一段故事','imagination','你在手札裡寫下這段重逢，植物的葉尖亮起星光。'])}}return ev}

$('chapterSteps').innerHTML=[{n:'序章',min:0,max:0},{n:'萌芽',min:1,max:3},{n:'生長',min:4,max:7},{n:'綻放',min:8,max:10}].map((x,i)=>`<span class="${state.step>=x.min?'passed':''} ${state.step>=x.min&&state.step<=x.max?'current':''}" title="${x.n}">${i?'<em></em>':''}${x.n}</span>`).join('');
$('scene').dataset.phase=state.phase;
$('plantRender').innerHTML=plantSvg();$('plantName').textContent=state.name||'命運之種';$('sceneChapter').textContent=state.phase==='adopt'?'A QUIET BEGINNING':state.phase==='end'?'THE GARDEN AWAKENS':state.step<=3?'CHAPTER ONE · THE WOODS':state.step<=7?'CHAPTER TWO · THE TRIALS':'CHAPTER THREE · THE GARDEN';$('plantSubtitle').textContent=state.phase==='adopt'?'每一個選擇，都會留下生長的痕跡':`旅程 ${state.step} / 10 · ${['種子','初芽','幼苗','新枝','花苞','綻放'][stage()]}`;$('sceneBottom').innerHTML=state.step?`✦ 植物正散發著「<b>${names[top]}</b>」的氣息`:'✦ 輕觸植物，感受它的回應';$('scene').className='scene '+({calm:'moon',warmth:'warm',imagination:'dream'}[top]||'')+(state.phase==='end'?' ending-scene':'');$('itemCount').textContent=state.inventory.length+' 件物品';$('inventory').innerHTML=state.inventory.length?state.inventory.map(id=>`<span class="item active">${gifts[id].emoji} ${gifts[id].name}${state.usedGift?' · 已使用':''}</span>`).join(''):'<span class="small">尚未取得物品。第三關會遇見星光商人。</span>';$('log').innerHTML=state.log.length?state.log.map(t=>`<div>✦ ${esc(t)}</div>`).join(''):'<div>故事即將開始……</div>';renderStory()}
function optionButtons(opts){return opts.map((o,i)=>`<button class="choice" data-choice="${i}"><span class="n">${'ABCD'[i]}</span><span>${esc(o.label)}</span></button>`).join('')}
function renderStory(){let el=$('story');if(state.phase==='adopt'){el.innerHTML=`<div class="chapter">PROLOGUE · 序章</div><h1>如果人生是一株植物</h1><p>森林守護者送給你一顆神祕種子。它不會照著你的願望生長，而是記住你一路上做過的選擇。</p><p>替它取個名字，選一只花盆，踏入森林吧。</p><label class="small" for="nameInput">你的植物叫什麼名字？</label><input class="adopt-input" id="nameInput" maxlength="12" placeholder="例如：青嵐、微光" value="${esc(state.name)}"><p class="small">選擇花盆（純外觀，不影響進化）</p><div class="pots">${Object.entries(pots).map(([id,label])=>`<button class="potpick ${state.pot===id?'active':''}" data-pot="${id}"><svg viewBox="85 238 190 110">${potSvg(id)}</svg>${label}</button>`).join('')}</div><button class="primary" style="width:100%;margin-top:18px" id="startBtn">開始十幕奇幻旅程 →</button><div class="note" style="margin-top:13px">完成十幕旅程後，將揭曉八種命運植物之一、你的旅人特質與故事線索，並自動加入圖鑑。</div>`;return}
if(state.phase==='outcome'){el.innerHTML=`<div class="chapter">THE SEED REMEMBERS · 種子的回應</div><h2>森林記住了這個選擇</h2><div class="special">${esc(state.lastOutcome)}</div><p>花盆裡的植物又悄悄改變了模樣。這段旅程正一點一滴留在它的枝葉裡。</p><div class="row"><span class="small">旅程進度 ${state.step} / 10</span><span class="small">${state.step*10}%</span></div><div class="progress"><div style="width:${state.step*10}%"></div></div><button class="primary" style="width:100%" id="nextBtn">${state.step===10?'見證命運之種綻放 ✦':'繼續下一幕 →'}</button>`;return}
if(state.phase==='end'){archive();let id=state.endingId||destiny(),sp=species[id],percent=percentAttrs(),ev=evidence(),count=new Set(getCollection().map(x=>x.id)).size;
el.innerHTML=`<div class="chapter">THE GARDEN AWAKENS · 旅程終章</div><div class="row"><span class="small">命運植物人格解析</span><span class="small">圖鑑 ${count} / 8</span></div><h1>你的命運植物：${sp.name}</h1><p style="font-size:15px;color:#8c8c76">${sp.tag}</p><div class="special" style="text-align:center"><strong style="font-size:20px;color:#526e58">${sp.title}</strong><div style="margin-top:9px">${sp.desc}</div></div><h2 style="font-size:18px">✦ 你的旅人特質</h2><p class="small">以下百分比為本次旅程十次選擇的分布，並非科學人格測驗或真實人格強度。</p><div class="trait-bars">${percent.map(x=>`<div class="trait-row"><span>${names[x.key]}</span><div class="trait-track"><div style="width:${x.value}%;background:${{adventure:'#cfa660',calm:'#82adb9',warmth:'#d09aa2',imagination:'#aa98c7'}[x.key]}"></div></div><b>${x.value}%</b></div>`).join('')}</div><h2 style="font-size:18px;margin-top:20px">✦ 森林留下的線索</h2>${ev.map(x=>`<div class="evidence"><span>第 ${x.step+1} 幕</span><div><strong>${esc(x.event)}</strong><p>你選擇「${esc(x.label)}」，展現了這段旅程中「${names[x.attr]||'探索'}」的傾向。</p></div></div>`).join('')||'<p>你完成了這段獨特的森林旅程。</p>'}<div class="special">森林寄語：「${sp.quote}」</div><div class="row"><button class="secondary" id="showDex">♧ 查看植物圖鑑</button><button class="secondary" id="copyResult">⧉ 複製旅程紀念卡</button><button class="primary" id="replayBtn">↺ 開始新的旅程</button></div><div class="note" style="margin-top:13px">每一株植物都沒有好壞之分。這是一款以選擇為靈感的奇幻遊戲，不是經過驗證的心理評估。</div>`;return}
let ev=sceneForStep();let head=`<div class="chapter">${ev.chapter}</div><div class="row"><span class="small">事件 ${state.step+1} / 10</span><span class="small">${state.step*10}%</span></div><div class="progress"><div style="width:${state.step*10}%"></div></div><h1>${ev.name}</h1><p>${ev.body}</p>`;let options='';if(ev.kind==='gift')options=`<div class="cards">${Object.entries(gifts).map(([id,g])=>`<button class="gift" data-gift="${id}"><span class="emoji">${g.emoji}</span><strong style="font-size:13px">${g.name}</strong><small>${g.desc}</small></button>`).join('')}</div><div class="note" style="margin-top:12px">只能選一件。它會在第八關提供特殊選項。</div>`;else if(ev.kind==='gate'){let id=state.inventory[0];options=(id?`<button class="choice" data-gate="gift"><span class="n">✦</span><span>使用 ${gifts[id].emoji} ${gifts[id].name}，試著打開石門</span></button>`:'')+`<button class="choice" data-gate="adventure"><span class="n">A</span><span>尋找石門旁的另一條小徑</span></button><button class="choice" data-gate="calm"><span class="n">B</span><span>安靜觀察藤蔓的生長方向</span></button><button class="choice" data-gate="warmth"><span class="n">C</span><span>請求森林中的朋友一起幫忙</span></button>`}else if(ev.kind==='reflection')options=`<div class="cards reflections">${ev.options.map((o,i)=>`<button class="gift" data-choice="${i}"><span class="emoji">${['🏔️','🏡','🌌'][i]}</span><strong style="font-size:13px">${esc(o.label)}</strong><small>輕觸湖面倒影</small></button>`).join('')}</div>`;else options=optionButtons(ev.options);el.innerHTML=head+options+`<div class="note" style="margin-top:14px">沒有正確答案。每個決定都會留下痕跡。一般選項也可以按鍵盤 1～4 快速選擇。</div>`}
function commit(o,label){if(state.phase!=='play'||state.step>=10)return;state.attrs[o.attr]=(state.attrs[o.attr]||0)+1;if(o.flag)state.flags[o.flag]=true;let ev=sceneForStep();state.log.unshift(`第 ${state.step+1} 幕 · ${ev.name}：${label||o.label}`);state.choices.push({step:state.step,event:ev.name,label:label||o.label,attr:o.attr});state.lastOutcome=o.result;state.step++;state.phase='outcome';save();render();spark('✦')}
function choose(i){if(state.phase!=='play')return;let ev=sceneForStep();if(!ev.options||!ev.options[i])return;commit(ev.options[i])}
function chooseGift(id){if(state.phase!=='play'||state.step!==2||!gifts[id])return;state.inventory=[id];commit({attr:gifts[id].attr,result:`你收下了「${gifts[id].name}」。商人輕聲說：「它會在你需要的時候回應你。」植物長出新的枝葉，記住了這份禮物。`},`收下${gifts[id].name}`)}
function gate(id){if(state.phase!=='play'||state.step!==7)return;if(id==='gift'){let item=state.inventory[0];if(!item||state.usedGift)return;state.usedGift=true;let g=gifts[item],msg={compass:'羅盤指針指向石門下的隱藏道路，藤蔓緩緩退開。',bottle:'你打開星星瓶，微光穿透濃霧，照亮石門上的古老符號。',ribbon:'你將緞帶繫在石門上，回憶中的溫暖讓藤蔓開出花朵。'}[item];commit({attr:g.attr,result:msg},`使用${g.name}通過迷霧大門`);return}let opt={adventure:['尋找另一條小徑','你沿著石牆探索，發現一條通往花園的小路。'],calm:['觀察藤蔓的方向','你耐心觀察，找到藤蔓間自然形成的入口。'],warmth:['向森林朋友求助','螢火蟲與森林旅人一起幫忙，石門終於緩緩開啟。']}[id];if(opt)commit({attr:id,result:opt[1]},opt[0])}
function next(){if(state.phase!=='outcome')return;state.phase=state.step>=10?'end':'play';if(state.phase==='end')archive();save();render()}
function spark(symbol){let area=$('plantArea');area.classList.remove('tapped');void area.offsetWidth;area.classList.add('tapped');for(let i=0;i<6;i++){let e=document.createElement('span');e.className='spark';e.textContent=symbol;e.style.left=(25+Math.random()*50)+'%';e.style.top=(26+Math.random()*40)+'%';e.style.animationDelay=i*.075+'s';area.appendChild(e);setTimeout(()=>e.remove(),1450)}setTimeout(()=>area.classList.remove('tapped'),650)}
function showDex(){let col=getCollection(),unlocked=new Set(col.map(x=>x.id));$('modalRoot').innerHTML=`<div class="modal-bg" id="modalBg"><div class="modal dex-modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="row"><h2 id="modalTitle">命運植物圖鑑</h2><button class="secondary" id="cancelReset">關閉 ×</button></div><p>已發現 ${unlocked.size} / 8 種植物。完成不同旅程，探索其他可能。</p><div class="dex-grid">${typeOrder.map(id=>`<button type="button" class="dex-card ${unlocked.has(id)?'unlocked':''}" ${unlocked.has(id)?`data-species="${id}"`:"disabled"}><div class="dex-icon">${unlocked.has(id)?'<span style="color:'+species[id].colors[0]+'">✿</span>':'♧'}</div><strong>${unlocked.has(id)?species[id].name:'???'}</strong><small>${unlocked.has(id)?species[id].title:'尚未發現'}</small></button>`).join('')}</div><h3>旅程收藏（${col.length}）</h3><div class="history">${col.length?col.slice(0,30).map(x=>`<div><strong>${esc(x.name)} · ${species[x.id]?.name||'未知植物'}</strong><span>${new Date(x.finishedAt).toLocaleDateString('zh-TW')} · ${species[x.id]?.title||''}</span></div>`).join(''):'<p>完成第一趟旅程後，就會收藏你的第一株命運植物。</p>'}</div></div></div>`;let close=$('cancelReset');if(close)close.focus()}
function copyResult(){
if(state.phase!=='end')return;
let sp=species[state.endingId||destiny()];
let t=`✦ Life Garden｜命運之種 ✦\n我的命運植物：${sp.name}\n旅人特質：${sp.title}\n${sp.tag}\n\n${sp.desc}\n\n旅途足跡：\n${evidence().map(x=>`第${x.step+1}幕・${x.event}：${x.label}`).join('\n')}\n\n森林寄語：「${sp.quote}」\n（奇幻故事選擇結果，非正式人格測驗）`;
if(navigator.clipboard?.writeText){navigator.clipboard.writeText(t).then(()=>toast('旅程紀念卡已複製 ✦')).catch(()=>fallbackCopy(t))}
else fallbackCopy(t);
}
function fallbackCopy(t){let el=document.createElement('textarea');el.value=t;el.style.position='fixed';el.style.opacity='0';document.body.appendChild(el);el.select();try{document.execCommand('copy');toast('旅程紀念卡已複製 ✦')}catch{toast('目前瀏覽器不支援複製')}el.remove()}
function speciesDetail(id){let sp=species[id];if(!sp)return;
$('modalRoot').innerHTML=`<div class="modal-bg" id="modalBg"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="row"><div><div class="chapter">BOTANICAL ARCHIVE · 植物檔案</div><h2 id="modalTitle">${sp.name}</h2></div><button class="secondary" id="backDex">返回圖鑑 ←</button></div><div class="species-preview">${speciesArt(id)}</div><p><strong>${sp.title}</strong></p><p>${sp.tag}</p><div class="special">「${sp.quote}」</div><p class="small">${sp.desc}</p></div></div>`;
}
function modal(){ $('modalRoot').innerHTML=`<div class="modal-bg" id="modalBg"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><h2 id="modalTitle">重新開始旅程？</h2><p>這會重設本次旅程，但已收藏的命運植物與歷次結果都會保留。V1～V6 的資料不受影響。</p><div class="row"><button class="secondary" id="cancelReset">取消</button><button class="primary" id="confirmReset">確認重新開始</button></div></div></div>`;$('cancelReset').focus()}
$('story').addEventListener('click',e=>{let p=e.target.closest('[data-pot]');if(p&&state.phase==='adopt'){state.pot=p.dataset.pot;save();render();return}if(e.target.closest('#startBtn')&&state.phase==='adopt'){state.name=$('nameInput').value.trim().slice(0,12)||'微光';state.phase='play';save();render();toast('十幕旅程開始了');return}let c=e.target.closest('[data-choice]');if(c)choose(Number(c.dataset.choice));let g=e.target.closest('[data-gift]');if(g)chooseGift(g.dataset.gift);let gateBtn=e.target.closest('[data-gate]');if(gateBtn)gate(gateBtn.dataset.gate);if(e.target.closest('#nextBtn'))next();if(e.target.closest('#replayBtn'))modal();if(e.target.closest('#showDex'))showDex();if(e.target.closest('#copyResult'))copyResult()});
$('story').addEventListener('input',e=>{if(e.target.id==='nameInput'&&state.phase==='adopt'){state.name=e.target.value.slice(0,12);save();$('plantName').textContent=state.name||'命運之種'}});
$('resetBtn').addEventListener('click',modal);$('dexBtn').addEventListener('click',showDex);$('modalRoot').addEventListener('click',e=>{if(e.target.id==='cancelReset'||e.target.id==='modalBg')$('modalRoot').innerHTML='';if(e.target.id==='backDex'){showDex();return}let dex=e.target.closest('[data-species]');if(dex){speciesDetail(dex.dataset.species);return}if(e.target.id==='confirmReset'){$('modalRoot').innerHTML='';state=initial();save();render();toast('新的旅程開始了')}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('modalRoot').innerHTML='';
if(!e.altKey&&!e.ctrlKey&&!e.metaKey&&state.phase==='play'&&['1','2','3','4'].includes(e.key)&&!['INPUT','TEXTAREA'].includes(document.activeElement.tagName)&&!$('modalRoot').innerHTML){let btn=$('story').querySelectorAll('[data-choice]')[Number(e.key)-1];if(btn){e.preventDefault();btn.click()}}
if((e.key==='Enter'||e.key===' ')&&document.activeElement===$('plantArea')){e.preventDefault();spark('✦')}});
$('plantArea').addEventListener('click',()=>spark('✦'));$('carePanel').addEventListener('click',e=>{let b=e.target.closest('[data-care]');if(!b)return;let v={water:['💧','露水落在葉尖，閃爍著細微光芒。'],sun:['☀️','暖光灑落，植物輕輕舒展枝葉。'],music:['♫','森林的風聲響起，植物隨之輕輕搖曳。']}[b.dataset.care];if(v){spark(v[0]);toast(v[1])}});
render();
})();
</script></body></html>
